    <ellipse cx="368" cy="172" rx="20" ry="26" transform="rotate(-35 368 172)" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
    <circle cx="372" cy="150" r="15" fill="#4A2E23"/>
  </g>
  <!-- Body -->
  <g>
    <ellipse cx="200" cy="292" rx="98" ry="90" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
    <ellipse cx="200" cy="314" rx="62" ry="56" fill="#FFF3E0" stroke="#2E1B12" stroke-width="4"/>
  </g>
