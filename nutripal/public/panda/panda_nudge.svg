    <circle cx="170" cy="174" r="8" fill="#1B2B22"/>
    <circle cx="230" cy="174" r="8" fill="#1B2B22"/>
    <circle cx="167" cy="171" r="2.5" fill="#FFFFFF"/>
    <circle cx="227" cy="171" r="2.5" fill="#FFFFFF"/>
    <path d="M 183 210 Q 191 215 200 210 Q 209 205 217 210" fill="none" stroke="#2E1B12" stroke-width="6" stroke-linecap="round"/>
