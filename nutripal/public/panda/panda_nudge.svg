    <circle cx="96" cy="338" r="23" fill="#4A2E23" stroke="#2E1B12" stroke-width="4"/>
    <ellipse cx="298" cy="300" rx="27" ry="43" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
    <circle cx="304" cy="338" r="23" fill="#4A2E23" stroke="#2E1B12" stroke-width="4"/>
  </g>
  <!-- Head (identical geometry to the other 3 expressions, tilted slightly — the one allowed posture change) -->
  <g transform="rotate(-7 200 164)">
    <circle cx="130" cy="97" r="35" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
    <circle cx="270" cy="97" r="35" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
    <circle cx="138" cy="103" r="18" fill="#4A2E23"/>
    <circle cx="262" cy="103" r="18" fill="#4A2E23"/>
    <circle cx="200" cy="164" r="93" fill="#C9673A" stroke="#2E1B12" stroke-width="5"/>
