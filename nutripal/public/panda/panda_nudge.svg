    <ellipse cx="200" cy="199" rx="11" ry="8" fill="#4A2E23"/>
    <!-- Face: soft worried eyebrows, gentle neutral mouth — never sad/crying -->
    <path d="M 156 152 Q 168 146 180 152" fill="none" stroke="#2E1B12" stroke-width="4" stroke-linecap="round"/>
    <path d="M 220 152 Q 232 146 244 152" fill="none" stroke="#2E1B12" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="170" r="15" fill="#FFFFFF" stroke="#2E1B12" stroke-width="3"/>
